     if the API script is blocked the player still loads, just without the loop) -->
</div>
<script src="https://vk.com/js/api/videoplayer.js"></script><script>
  (function () {
    var f = document.getElementById('clip');
    if (!f) return;
    f.src = f.getAttribute('data-src');          /* the API validates src, and listens before the frame finishes loading */
    try {
      var player = VK.VideoPlayer(f);
      player.on('ended', function () { player.seek(0); player.play(); });
    } catch (e) { /* API script blocked: player still works, just no loop */ }
  })();
</script><script>
  /* phones: the nav is drawn in the hero art; show the real fixed bar only after the hero scrolls away */
  (function () {
    var bar = document.querySelector('.mnav'), hero = document.querySelector('.hero-clip');
    function upd() { bar.classList.toggle('on', hero.getBoundingClientRect().bottom < 60); }
    addEventListener('scroll', upd, { passive: true }); addEventListener('resize', upd); upd();
  })();
</script><script>
  /* Spotify's header (artist, subscribe, controls) is cut off by the panel edge so only the track list shows.
     The iframe is cross-origin, so it is shifted up by HDR px inside the clipped panel.
     desktop: scaled to the panel in the art; phones: natural size, CSS does the shift */
  (function () {
    var HDR = 200, FULL = 470;
    var box = document.getElementById('player'), f = document.getElementById('ymusic');
    var mq = matchMedia('(max-width: 899px)');
    function fit() {
      if (mq.matches) { f.style.width = f.style.height = f.style.transform = ''; return; }
      var s = box.clientHeight / (FULL - HDR);
      f.style.height = FULL + 'px';
      f.style.width = (box.clientWidth / s) + 'px';
      f.style.transform = 'scale(' + s + ') translateY(-' + HDR + 'px)';
    }
    new ResizeObserver(fit).observe(box); fit();
  })();
</script>
