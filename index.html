<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>гденебо — искренний братский поп-панк</title>
  <meta name="description" content="гденебо — дуэт, искренний братский поп-панк. Музыка, видео, контакты.">
  <meta name="theme-color" content="#1a1030">
  <meta property="og:title" content="гденебо">
  <meta property="og:description" content="искренний братский поп-панк">
  <meta property="og:image" content="img/hero-wide.webp?v=4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- real nav: phones only (on wide screens the nav is part of the hero art) -->
<header class="mnav">
  <nav aria-label="Основная навигация">
    <a href="#video">Видео</a>
    <a href="#music">Музыка</a>
    <a href="#contacts">Контакты</a>
  </nav>
</header>

<main>
  <!-- 1. HERO -->
  <div class="hero-clip">
  <section class="hero" id="top">
    <h1 class="sr-only">гденебо — искренний братский поп-панк</h1>
    <picture>
      <img class="hero__img" src="img/hero-wide.webp?v=4" width="1920" height="1154"
           alt="Двое участников группы гденебо в красном и синем спортивных костюмах сидят на кирпичной стене на фоне закатного города. Вывеска: гденебо — искренний братский поп-панк.">
    </picture>
    <!-- pixel-art animation layers: frame sprites, 10 fps, whole logical pixels only -->
    <i class="px px--text px--text-d" aria-hidden="true"></i>
    <i class="px px--stars-a" aria-hidden="true"></i>
    <i class="px px--stars-b" aria-hidden="true"></i>
    <i class="px px--stars-c" aria-hidden="true"></i>
    <i class="px px--fx-l" aria-hidden="true"></i>
    <i class="px px--fx-r" aria-hidden="true"></i>
    <i class="px px--lamp-l" aria-hidden="true"></i>
    <i class="px px--lamp-r" aria-hidden="true"></i>
    <i class="px px--cat" aria-hidden="true"></i>
    <!-- clickable areas over the nav drawn in the art -->
    <nav class="hot" aria-label="Основная навигация">
      <a style="left:25.1%;width:16.6%" href="#video" aria-label="Видео"></a>
      <a style="left:41.7%;width:16.6%" href="#music" aria-label="Музыка"></a>
      <a style="left:58.3%;width:16.6%" href="#contacts" aria-label="Контакты"></a>
    </nav>
  </section>
  </div>

  <!-- 2. VIDEO -->
  <section class="scene scene--video" id="video" aria-label="Видео">
    <div class="stage">
      <div class="slot slot--video">
        <div class="screen">
          <!-- VK video player (vkvideo.ru domain: the vk.com embed rendered a black screen) -->
          <iframe id="clip" data-src="https://vkvideo.ru/video_ext.php?oid=-128118068&id=456239232&hd=2&js_api=1&loop=1"
                  title="Клип гденебо" loading="lazy" allowfullscreen
                  allow="autoplay; encrypted-media; fullscreen; picture-in-picture"></iframe>
        </div>
      </div>
      <!-- TV bezel with a transparent screen, drawn above the video -->
      <i class="px px--tvbtn" aria-hidden="true"></i>
      <i class="px px--knob-a" aria-hidden="true"></i>
      <i class="px px--knob-b" aria-hidden="true"></i>
      <img class="tvframe" src="img/tv-frame.webp" width="1120" height="640" alt="" aria-hidden="true">
    </div>
  </section>

  <!-- 3. MUSIC -->
  <section class="scene scene--music" id="music" aria-label="Музыка">
    <div class="stage"><i class="px px--vinyl" aria-hidden="true"></i></div>
    <div class="slot slot--music">
      <ul class="plat">
        <li><a class="plat__a" href="https://vk.com/artist/gdenebo" target="_blank" rel="noopener">
          <img src="img/icon-vk.png" width="96" height="96" alt=""><span>VK Музыка</span></a></li>
        <li><a class="plat__a" href="https://music.yandex.ru/artist/8538172" target="_blank" rel="noopener">
          <img src="img/icon-yandex.png" width="96" height="96" alt=""><span>Яндекс Музыка</span></a></li>
        <li><a class="plat__a" href="https://open.spotify.com/artist/1uYlEnMz2OyrIvt9TrfFQ6?si=vx1tbPylQhm6BDXislVgFA" target="_blank" rel="noopener">
          <img src="img/icon-spotify.png" width="96" height="96" alt=""><span>Spotify</span></a></li>
      </ul>
    </div>
  </section>

  <!-- 4. ABOUT + CONTACTS -->
  <section class="scene scene--contacts" id="contacts" aria-label="О группе и контакты">
    <div class="slot slot--contacts">
      <div class="about" id="about">
        <p class="lead">гденебо — искренний братский поп-панк.</p>
        <p>Двое друзей, гитары и песни про то, что болит и что греет. Здесь будет история группы.</p>
      </div>
      <div class="links links--contacts">
        <a class="btn" href="mailto:hello@gdenebo.ru">hello@gdenebo.ru</a>
        <a class="btn" href="#">Telegram</a>
        <a class="btn" href="#">VK</a>
        <a class="btn" href="#">YouTube</a>
      </div>
    </div>
  </section>
</main>

<footer class="foot">
  <span>© 2026 гденебо</span>
  <a href="#top">наверх ▲</a>
</footer>

<!-- loop the clip: VK player API restarts it on "ended" (listener must exist before the player loads, so src is set here;
     if the API script is blocked the player still loads, just without the loop) -->
<script src="https://vk.com/js/api/videoplayer.js"></script>
<script>
  (function () {
    var f = document.getElementById('clip');
    if (!f) return;
    f.src = f.getAttribute('data-src');          /* the API validates src, and listens before the frame finishes loading */
    try {
      var player = VK.VideoPlayer(f);
      player.on('ended', function () { player.seek(0); player.play(); });
    } catch (e) { /* API script blocked: player still works, just no loop */ }
  })();
</script>
<script>
  /* phones: the nav is drawn in the hero art; show the real fixed bar only after the hero scrolls away */
  (function () {
    var bar = document.querySelector('.mnav'), hero = document.querySelector('.hero-clip');
    function upd() { bar.classList.toggle('on', hero.getBoundingClientRect().bottom < 60); }
    addEventListener('scroll', upd, { passive: true }); addEventListener('resize', upd); upd();
  })();
</script>
</body>
</html>
